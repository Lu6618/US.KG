<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小陆小李的情侣小游戏</title>
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#FFB6C1;font-family:sans-serif;}
  .container{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .board{
    display:grid;
    grid-template-columns:repeat(6,60px);
    grid-template-rows:repeat(6,60px);
    gap:6px;
  }
  .cell{
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
    transition: transform 0.2s, outline 0.2s, box-shadow 0.2s;
    color:#000;
  }
  .reward { background:#FFFF99; }   
  .penalty { background:#FF6666; }  
  .safe { background:#66CCFF; }     
  .active{outline:4px solid #ff9800; transform:scale(1.25);}
  .safe-active{animation:safeFlash 0.6s ease; border:4px solid #4caf50; transform:scale(1.3);}
  @keyframes safeFlash{
    0%{box-shadow:0 0 0px #4caf50;}
    50%{box-shadow:0 0 15px #4caf50;}
    100%{box-shadow:0 0 0px #4caf50;}
  }
  @keyframes finalFlash {
    0%, 100% { box-shadow:0 0 0px #ff9800; transform: scale(1.25);}
    50% { box-shadow:0 0 20px #ff9800; transform: scale(1.35);}
  }
  .final-active {
    animation: finalFlash 0.1s infinite;
    border: 4px solid #ff9800;
  }
  .btn{padding:12px 20px;border:none;border-radius:8px;background:#4a90e2;color:#fff;font-weight:bold;cursor:pointer;}
  .status{font-size:25px;font-weight:900;color:#fff;}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;}
  .modal{background:#fff;padding:20px;border-radius:12px;max-width:300px;text-align:center;color:#333;}
  .actions{margin-top:12px;display:flex;gap:10px;}
  .actions button{flex:1;padding:10px;border:none;border-radius:8px;cursor:pointer;font-weight:600;}
  .ok{background:#4caf50;color:#fff;}
  .fail{background:#e53935;color:#fff;}
</style>
</head>
<body>
<div class="container">
  <div class="status" id="turnLabel">当前轮到：男方</div>
  <div class="board" id="board"></div>
  <button class="btn" id="startBtn">开始游戏</button>
</div>

<!-- 音效 -->
<audio id="tickSound" src="tick.mp3" preload="auto"></audio>
<audio id="dingSound" src="ding.mp3" preload="auto"></audio>

<div class="backdrop" id="taskModal">
  <div class="modal">
    <div id="taskTitle" style="font-weight:700;margin-bottom:8px;">任务</div>
    <div id="taskText">这里显示任务内容</div>
    <div class="actions">
      <button class="ok" id="btnComplete">完成</button>
      <button class="fail" id="btnFail">未完成</button>
    </div>
  </div>
</div>

<script>
const board = document.getElementById("board");
const taskModal = document.getElementById("taskModal");
const taskTitle = document.getElementById("taskTitle");
const taskText = document.getElementById("taskText");
const btnComplete = document.getElementById("btnComplete");
const btnFail = document.getElementById("btnFail");
const startBtn = document.getElementById("startBtn");
const turnLabel = document.getElementById("turnLabel");

const tickSound = document.getElementById("tickSound");
const dingSound = document.getElementById("dingSound");

const SIZE = 6;
const cells = [];
let turn = 0;
const players = ["男方","女方"];

const rewards = ["指定身上任意位置让对方舔20秒","对方跪着自己站着让他（她）口一分钟","用嘴含住对方的蛋蛋或阴蒂半分钟","用奶或JJ蹭对方的脸10秒","拔对方一根毛","对方给你口交20秒"];
const penalties = ["和对方舌吻十秒","舔对方的任何部位30秒","给对方口交30秒","吸咬对方的乳头20秒","用嘴含住对方的蛋蛋或阴蒂10秒","对方站着自己跪着帮他（她）口20秒","像口交一样吸吮对方手指10秒","用手扣自己下面1分钟，或撸30下","帮对手含住蛋蛋或阴蒂10秒舌头打转","撅起PP让对方打3下","被对方用牙齿咬住乳头磨蹭10秒","男方站立抱起女方悬空插入20次不许射"];

function sortTasksSpecially(tasks){
  return tasks.slice()
    .sort((a,b)=>a.length-b.length)
    .map((task,i)=>({task,i}))
    .sort((a,b)=>a.i%2-b.i%2)
    .map(obj=>obj.task);
}
const rewardsSpecial = sortTasksSpecially(rewards);
const penaltiesSpecial = sortTasksSpecially(penalties);

const pattern = [
  ["reward","safe","penalty","reward","safe","penalty"],
  ["safe","penalty","reward","safe","penalty","reward"],
  ["penalty","reward","safe","penalty","reward","safe"],
  ["reward","safe","penalty","reward","safe","penalty"],
  ["safe","penalty","reward","safe","penalty","reward"],
  ["penalty","reward","safe","penalty","reward","safe"]
];

for (let row=0; row<SIZE; row++){
  for (let col=0; col<SIZE; col++){
    const type = pattern[row][col];
    const cell = document.createElement("div");
    cell.className = `cell ${type}`;
    cell.dataset.type = type;
    cell.innerText = type==="reward"?"奖励":type==="penalty"?"惩罚":"安全";
    board.appendChild(cell);
    cells.push(cell);
  }
}

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function clearActive(){
  cells.forEach(cell => cell.classList.remove("active","safe-active","final-active"));
}

// 播放音效，每次克隆一个实例
function playTick(){
  const sound = tickSound.cloneNode();
  sound.play();
}

// 随机选择格子，闪烁 + 音效同步
async function randomSelect(){
  let last = null;
  const steps = randInt(20,30);
  let speed = 30;

  for(let i=0;i<steps;i++){
    if(last) last.classList.remove("active","safe-active");
    const idx = randInt(0,cells.length-1);
    const cell = cells[idx];
    cell.classList.add("active");

    playTick();

    last = cell;
    await sleep(speed);
    speed += Math.floor(Math.pow(i/steps,2)*50)+10;
  }

  if(last) last.classList.remove("active");
  dingSound.currentTime = 0;
  dingSound.play();

  return last;
}

// 显示任务并让最后格子持续闪烁
function showTask(type, cell) {
  taskModal.style.display = "flex";

  // 移除上一次 final-active
  cells.forEach(c => c.classList.remove("final-active"));

  if(type==="reward"){
    taskTitle.innerText="奖励任务";
    taskText.innerText=rewardsSpecial[randInt(0,rewardsSpecial.length-1)];
    cell.classList.add("final-active");
  } else if(type==="penalty"){
    taskTitle.innerText="惩罚任务";
    taskText.innerText=penaltiesSpecial[randInt(0,penaltiesSpecial.length-1)];
    cell.classList.add("final-active");
  } else {
    taskTitle.innerText="安全区";
    taskText.innerText="恭喜，本轮无任务！";
    cell.classList.add("safe-active","final-active");
    cell.addEventListener('animationend', () => cell.classList.remove('safe-active'), { once: true });
  }
}

// 按钮逻辑
startBtn.onclick=async()=>{
  startBtn.disabled=true;
  clearActive();
  const cell = await randomSelect();
  showTask(cell.dataset.type,cell);
};

btnComplete.onclick=()=>{
  taskModal.style.display="none";
  nextTurn();
};
btnFail.onclick=()=>{
  taskModal.style.display="none";
  alert(players[turn]+"未完成任务，作为惩罚请自行决定额外处罚！");
  nextTurn();
};

function nextTurn(){
  turn = (turn+1)%2;
  turnLabel.innerText = "当前轮到："+players[turn];
  startBtn.disabled=false;
}
</script>
</body>
</html>
